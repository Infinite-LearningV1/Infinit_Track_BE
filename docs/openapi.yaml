  /api/attendance/geofence-evidence:
    get:
      tags:
        - Attendance
      summary: Get historical geofence evidence snapshot
      description: Retrieve context-only geofence evidence for a historical attendance window. This endpoint supports historical window queries, does not own live map snapshots, and is not the final attendance authority; attendance records remain canonical.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: period
          schema:
            type: string
            enum: [daily, weekly, monthly, range, 30d, current_month, custom]
            default: 30d
          description: Historical evidence window. Canonical values are `daily` (today), `weekly` (rolling 7 days), `monthly` (rolling 30 days), and `range` with `from`/`to`. Legacy values `30d`, `current_month`, and `custom` remain temporarily supported. `all` is not supported.
        - in: query
          name: from
          schema:
            type: string
            format: date
            example: '2026-04-01'
          description: Custom range start date in `YYYY-MM-DD` format. Required when period=range or deprecated period=custom.
        - in: query
          name: to
          schema:
            type: string
            format: date
            example: '2026-04-30'
          description: Custom range end date in `YYYY-MM-DD` format. Required when period=range or deprecated period=custom.
      responses:
        '200':
          description: Geofence evidence retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  requested_window:
                    type: object
                    properties:
                      period:
                        type: string
                        example: custom
                      from:
                        type: string
                        format: date
                        nullable: true
                        example: '2026-04-01'
                      to:
                        type: string
                        format: date
                        nullable: true
                        example: '2026-04-30'
                  executed_window:
                    type: object
                    properties:
                      from:
                        type: string
                        format: date
                        nullable: true
                        example: '2026-04-01'
                      to:
                        type: string
                        format: date
                        nullable: true
                        example: '2026-04-30'
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        enum: [available, needs_data]
                        example: available
                      needs_data:
                        type: boolean
                        example: false
                      reason:
                        type: string
                        nullable: true
                        example: null
                      authority:
                        type: string
                        example: context_only
                      final_attendance_authority:
                        type: string
                        example: attendance_records
                      window:
                        type: object
                        properties:
                          from:
                            type: string
                            format: date
                            nullable: true
                            example: '2026-04-01'
                          to:
                            type: string
                            format: date
                            nullable: true
                            example: '2026-04-30'
                      raw_counts:
                        type: object
                        properties:
                          total_events:
                            type: integer
                            example: 3
                          enter_events:
                            type: integer
                            example: 1
                          exit_events:
                            type: integer
                            example: 2
                          unique_users:
                            type: integer
                            example: 2
                      operational_context:
                        type: object
                        properties:
                          activity_label:
                            type: string
                            example: Active
                          activity_note:
                            type: string
                            example: 2 users generated 3 geofence events in this range.
                          enter_context:
                            type: string
                            example: ENTER events support check-in reminder monitoring.
                          exit_context:
                            type: string
                            example: EXIT events support active-session exit warning monitoring.
                          dashboard_note:
                            type: string
                            example: Location context only. Final attendance validity remains determined by backend attendance records.
                  message:
                    type: string
                    example: 'Geofence evidence retrieved successfully'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

