                  endpoint_type:
                    type: string
                    example: daily
                  mode:
                    type: string
                    example: dry-run
                  target_date:
                    type: string
                    format: date
                    example: '2026-07-01'
                  seed:
                    type: string
                    example: '2026-07-01:daily:research-batch-001'
                  existing_strategy:
                    type: string
                    example: skip
                  policy:
                    type: object
                  population:
                    type: object
                    nullable: true
                  selection_summary:
                    type: object
                    nullable: true
                  mode_summary:
                    type: object
                    nullable: true
                  discipline_summary:
                    type: object
                    nullable: true
                  warnings:
                    type: array
                    items:
                      type: string
                  conflicts:
                    type: array
                    items:
                      type: object
                  planned_writes:
                    type: object
                    nullable: true
                  would_replace:
                    type: object
                    nullable: true
                  applied_writes:
                    type: object
                    nullable: true
                  replaced:
                    type: object
                    nullable: true
                  skipped_existing:
                    type: integer
                    example: 0
                  skipped_conflict:
                    type: integer
                    example: 0
              examples:
                dryRun:
                  value:
                    success: true
                    endpoint_type: daily
                    mode: dry-run
                    target_date: '2026-07-01'
                    seed: '2026-07-01:daily:research-batch-001'
                    existing_strategy: skip
                    discipline_summary:
                      ontime: 12
                      late: 2
                      early: 1
                      alpha: 1
                    planned_writes:
                      attendance: 16
                      bookings: 1
                      location_events: 30
                    would_replace:
                      attendance: 0
                      location_events: 0
        '400':
