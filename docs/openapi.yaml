  /api/analysis/fuzzy-ahp/discipline:
    get:
      tags:
        - Analysis
      summary: Get Discipline Fuzzy AHP analysis
      description: Retrieve dedicated Discipline FAHP analysis from real attendance records. The legacy combined `/api/analysis/fuzzy-ahp?type=discipline` endpoint remains temporarily supported for compatibility.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: period
          required: false
          description: Analysis window. `custom` requires both `from` and `to` and is limited to 365 days.
          schema:
            type: string
            enum: [weekly, monthly, custom]
            default: monthly
        - in: query
          name: from
          required: false
          description: Custom start date in WIB calendar date format. Required when `period=custom`.
          schema:
            type: string
            format: date
            example: '2026-04-01'
        - in: query
          name: to
          required: false
          description: Custom end date in WIB calendar date format. Required when `period=custom`.
          schema:
            type: string
            format: date
            example: '2026-05-31'
      responses:
        '200':
          description: Discipline analysis retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      type:
                        type: string
                        example: discipline
                      period:
                        type: string
                        example: monthly
                      generated_at:
                        type: string
                        example: '2026-05-31T16:45:00+07:00'
                      timezone:
                        type: string
                        example: Asia/Jakarta
                      requested_window:
                        type: object
                        properties:
                          start_at:
                            type: string
                            nullable: true
                          end_at:
                            type: string
                            nullable: true
                      executed_window:
                        type: object
                        properties:
                          start_at:
                            type: string
                            example: '2026-05-01T00:00:00+07:00'
                          end_at:
                            type: string
                            example: '2026-05-31T16:45:00+07:00'
                      entity_kind:
                        type: string
                        example: user
                      consistency:
                        type: object
                        properties:
                          CR:
                            type: number
                            example: 0.079
                          CI:
                            type: number
                            example: 0
                          lambda_max:
                            type: number
                            example: 0
                          threshold:
                            type: number
                            example: 0.1
                          is_consistent:
                            type: boolean
                            example: true
                          verdict:
                            type: string
                            example: 'Matriks perbandingan konsisten (CR < 0.10)'
                      weights:
                        type: object
                        properties:
                          criteria:
                            type: array
                            items:
                              type: string
                            example: [alpha_rate, lateness_severity, lateness_frequency, work_focus]
                          values:
                            type: array
                            items:
                              type: number
                            example: [1, 0, 0, 0]
                          method:
                            type: string
                            example: "Chang's Extent Analysis"
                      distribution:
                        type: object
                        additionalProperties:
                          type: integer
                      scope:
                        type: string
                        description: Present when the analysis uses a constrained source scope, such as static WFA location catalog data.
                        example: place_catalog_static
                      window_applied:
                        type: boolean
                        description: Indicates whether the requested analysis window was applied to the ranked data source.
                        example: false
                      data_source:
                        type: object
                        description: Optional source metadata and assumptions for analysis modes with constrained runtime data.
                        additionalProperties: true
                        example:
                          type: location_catalog_static
                          assumptions:
                            - field: amenity_score
                              value: 50
                            - field: distance
                              value: 1000
                          warning: WFA analysis uses static location catalog assumptions because no runtime visit telemetry is applied.
                      ranking:
                        type: array
                        items:
                          type: object
                          properties:
                            rank:
                              type: integer
                            id:
                              type: integer
                            name:
                              type: string
                            score:
                              type: number
                            label:
                              type: string
                            breakdown:
                              type: object
                              additionalProperties: true
