  /api/analysis/fuzzy-ahp/wfa:
    get:
      tags:
        - Analysis
      summary: Get WFA Fuzzy AHP analysis
      description: Retrieve dedicated WFA FAHP analysis using Geoapify live Places data. The legacy combined `/api/analysis/fuzzy-ahp?type=wfa` endpoint remains temporarily supported for compatibility.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: lat
          required: true
          description: Latitude of the search origin.
          schema:
            type: number
            minimum: -90
            maximum: 90
            example: -0.8917
        - in: query
          name: lon
          required: true
          description: Longitude of the search origin.
          schema:
            type: number
            minimum: -180
            maximum: 180
            example: 119.8707
        - in: query
          name: radius_meters
          required: false
          description: Search radius in meters.
          schema:
            type: integer
            minimum: 100
            maximum: 50000
            default: 5000
            example: 5000
      responses:
        '200':
          description: WFA analysis retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
