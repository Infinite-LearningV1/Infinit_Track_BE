components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token passed as `Authorization: Bearer <token>`.
    cookieAuth:
      type: apiKey
      in: cookie
      name: token
      description: Access token stored in the HTTP-only `token` cookie for browser flows.

  schemas:
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: 'user@company.com'
        password:
          type: string
          format: password
          example: 'password123'

    RefreshRequest:
      type: object
      properties:
        refresh_token:
          type: string
          description: Required for non-browser refresh flows. Browser clients can rely on the HTTP-only `refresh_token` cookie instead.
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'

    AuthProfile:
      type: object
      required:
        - id
        - full_name
        - email
      properties:
        id:
          type: integer
          example: 5
        full_name:
          type: string
          example: 'User Example'
        email:
          type: string
          format: email
          example: 'user@example.com'
        role_name:
          type: string
          nullable: true
          example: 'Admin'
        position_name:
          type: string
          nullable: true
          example: 'Software Engineer'
        program_name:
          type: string
          nullable: true
          example: 'Informatics'
        division_name:
          type: string
          nullable: true
          example: 'Engineering'
        nip_nim:
          type: string
          nullable: true
          example: 'EMP-001'
        phone:
          type: string
          nullable: true
          example: '08123'
        photo:
          type: string
          nullable: true
          example: 'https://cloudinary.com/photo.jpg'
        photo_updated_at:
          type: string
          format: date-time
          nullable: true
          example: '2025-07-01T10:00:00.000Z'
        location:
          type: object
          nullable: true
          properties:
            latitude:
              type: number
              format: float
              example: -6.2
            longitude:
              type: number
              format: float
              example: 106.816666
            radius:
              type: number
              format: float
              example: 100
            description:
              type: string
              nullable: true
              example: 'WFH default location'
            category_name:
              type: string
              nullable: true
              example: 'WFH'

    AuthWebTokenBundle:
      type: object
      required:
        - access_token
      properties:
        access_token:
          type: string
          description: Primary access token field for the current authenticated session.
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'

    AuthNativeTokenBundle:
      allOf:
        - $ref: '#/components/schemas/AuthWebTokenBundle'
        - type: object
          required:
            - refresh_token
          properties:
            refresh_token:
              type: string
              description: Primary refresh token field for native/non-browser clients.
              example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'

    AuthLoginWebData:
      allOf:
        - $ref: '#/components/schemas/AuthProfile'
        - type: object
          required:
            - token
            - auth
          properties:
            token:
              type: string
              description: Backward-compatible access token field for authenticated requests.
              example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
            auth:
              $ref: '#/components/schemas/AuthWebTokenBundle'

    AuthLoginNonWebData:
      allOf:
        - $ref: '#/components/schemas/AuthLoginWebData'
        - type: object
          required:
            - refresh_token
            - auth
          properties:
            refresh_token:
              type: string
              description: Backward-compatible refresh token field returned to non-browser clients.
              example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
            auth:
              $ref: '#/components/schemas/AuthNativeTokenBundle'

    LoginWebResponse:
      type: object
      required:
        - success
        - data
        - message
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/AuthLoginWebData'
        message:
          type: string
          example: 'Login berhasil'

    LoginNonWebResponse:
      type: object
      required:
        - success
        - data
        - message
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/AuthLoginNonWebData'
        message:
          type: string
          example: 'Login berhasil'

    RefreshWebResponse:
      type: object
      required:
        - success
        - data
        - message
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required:
            - access_token
            - auth
          properties:
            access_token:
              type: string
              description: Backward-compatible access token field.
              example: 'new-access-token'
            auth:
              $ref: '#/components/schemas/AuthWebTokenBundle'
        message:
          type: string
          example: 'Refresh successful'

    RefreshNonWebResponse:
      type: object
      required:
        - success
        - data
        - message
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required:
            - access_token
            - refresh_token
            - auth
          properties:
            access_token:
              type: string
              description: Backward-compatible access token field.
              example: 'new-access-token'
            refresh_token:
              type: string
              description: Backward-compatible refresh token field.
              example: 'new-refresh-token'
            auth:
              $ref: '#/components/schemas/AuthNativeTokenBundle'
        message:
          type: string
          example: 'Refresh successful'

    LogoutResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: 'Logout successful'

    AuthProfileResponse:
      type: object
      required:
        - success
        - data
        - message
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/AuthProfile'
        message:
          type: string
          example: 'User profile fetched successfully'

    AccessTokenUnauthorizedError:
      type: object
      description: Message-only unauthorized response returned when access-token validation fails before the refreshable expiry contract applies.
      required:
        - message
      properties:
        message:
          type: string
          enum:
            - 'No token provided'
            - 'Invalid authorization header. Use: Bearer <token>'
            - 'Invalid token'
            - 'Unable to resolve authenticated user role'
          example: 'Invalid token'

    AccessTokenExpiredError:
      type: object
      description: Returned when a protected route receives an expired access JWT. Clients may attempt `/api/auth/refresh` if the refresh session is still active.
      required:
        - success
        - code
        - message
        - details
      properties:
        success:
          type: boolean
          example: false
        code:
          type: string
          example: 'AUTH_ACCESS_TOKEN_EXPIRED'
        message:
          type: string
          example: 'Access token expired'
        details:
          type: object
          required:
            - refreshable
          properties:
            refreshable:
              type: boolean
              example: true

    RefreshInvalidError:
      type: object
      required:
        - success
        - code
        - message
      properties:
        success:
          type: boolean
          example: false
        code:
          type: string
          example: 'AUTH_REFRESH_TOKEN_INVALID'
        message:
          type: string
          example: 'Refresh token invalid'

    RefreshRevokedError:
      type: object
      description: Returned when the persisted refresh session was already revoked, including after an explicit logout.
      required:
        - success
        - code
        - message
      properties:
        success:
          type: boolean
          example: false
        code:
          type: string
          example: 'AUTH_REFRESH_TOKEN_REVOKED'
        message:
          type: string
          example: 'Refresh session revoked'

    RefreshSessionInactiveError:
      type: object
      description: Returned when the refresh JWT expired, the persisted refresh session absolute expiry passed, or the inactivity window elapsed. Clients must log in again.
      required:
        - success
        - code
        - message
      properties:
        success:
          type: boolean
          example: false
        code:
          type: string
          example: 'AUTH_SESSION_INACTIVE'
        message:
          type: string
          example: 'Refresh session expired'

    AuthLoginErrorBody:
      type: object
      required:
        - success
        - code
        - message
      properties:
        success:
          type: boolean
          example: false
        code:
          type: string
          example: 'E_LOGIN'
        message:
          type: string
          example: 'Email tidak terdaftar'

    AuthenticatedUserNotFoundError:
      type: object
      required:
        - success
        - code
        - message
      properties:
        success:
          type: boolean
          example: false
        code:
          type: string
          example: 'E_USER_NOT_FOUND'
        message:
          type: string
          example: 'User tidak ditemukan'

    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          format: email
          example: 'user@company.com'
        full_name:
          type: string
          example: 'John Doe'
        is_active:
          type: boolean
          example: true
        photo:
