  /api/attendance/setup-auto-checkout:
    post:
      tags:
        - Advanced Attendance
      summary: Setup auto checkout configuration (Admin/Management only)
      description: Configure auto checkout settings and process historical data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enable_auto_checkout:
                  type: boolean
                  example: true
                default_checkout_time:
                  type: string
                  format: time
                  example: '17:30:00'
                smart_prediction:
                  type: boolean
                  example: true
                  description: Enable smart checkout time prediction
                location_based:
                  type: boolean
                  example: true
                  description: Use location history for checkout prediction
                minimum_work_hours:
                  type: number
                  format: float
                  example: 8.0
                maximum_work_hours:
                  type: number
                  format: float
                  example: 10.0
                process_historical_data:
                  type: boolean
                  example: false
                  description: Also process historical incomplete attendance records
      responses:
        '200':
          description: Auto checkout configuration updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Auto checkout configuration updated successfully'
                  data:
                    type: object
                    properties:
                      configuration:
                        type: object
                        properties:
                          enable_auto_checkout:
                            type: boolean
                            example: true
                          default_checkout_time:
                            type: string
                            format: time
                            example: '17:30:00'
                          smart_prediction:
                            type: boolean
                            example: true
                          location_based:
                            type: boolean
                            example: true
                      historical_processing:
                        type: object
                        properties:
                          enabled:
                            type: boolean
                            example: false
                          records_processed:
                            type: integer
                            example: 0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/attendance/smart-prediction:
    post:
      tags:
        - Advanced Attendance
      summary: Get smart checkout prediction (Admin/Management only)
      description: Get smart checkout time prediction for a user based on historical data and location patterns
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user_id
                - date
              properties:
                user_id:
                  type: integer
                  example: 1
                date:
                  type: string
                  format: date
                  example: '2025-07-05'
                current_location:
                  type: object
                  properties:
                    latitude:
                      type: number
                      format: float
                      example: -6.200000
                    longitude:
                      type: number
                      format: float
                      example: 106.816666
      responses:
        '200':
          description: Smart prediction generated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      user_id:
                        type: integer
                        example: 1
                      predicted_checkout_time:
                        type: string
                        format: time
                        example: '17:45:00'
                      confidence_score:
                        type: number
                        format: float
                        example: 0.87
                        description: Prediction confidence (0-1)
                      prediction_method:
                        type: string
                        example: 'fuzzy_logic_with_location'
                      factors:
                        type: object
                        properties:
                          historical_pattern:
                            type: number
                            format: float
                            example: 0.8
                          location_context:
                            type: number
                            format: float
                            example: 0.9
                          day_of_week:
                            type: number
                            format: float
                            example: 0.7
                          work_load_indicator:
                            type: number
                            format: float
                            example: 0.6
                      alternatives:
                        type: array
                        items:
                          type: object
                          properties:
                            time:
                              type: string
                              format: time
                              example: '17:30:00'
                            probability:
                              type: number
                              format: float
                              example: 0.25
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

