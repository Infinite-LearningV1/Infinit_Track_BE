openapi: 3.0.3
info:
  title: Infinite Track Backend API
  description: |
    Comprehensive API documentation for Infinite Track Backend - Employee Attendance & WFA Management System

    ## Overview
    Infinite Track Backend is a modern attendance management system with smart features including:
    - Employee attendance tracking with geofencing
    - Work From Anywhere (WFA) booking and recommendations
    - Smart auto-checkout with fuzzy logic
    - Automated job processing for alpha generation
    - Comprehensive reporting and analytics

    ## Authentication
    This API uses a stateless access token plus a stateful refresh session.

    Protected endpoints accept the access token through either:
    - `Authorization: Bearer <access_token>`
    - HTTP-only `token` cookie for browser-based flows

    Browser login sets HTTP-only `token` and `refresh_token` cookies while also returning the access token in `data.token`. Non-browser clients can receive a `refresh_token` in JSON and submit it to `/api/auth/refresh`.

    ## Timezone
    All timestamps are handled in WIB (Jakarta timezone, UTC+7) for consistency.

    ## Base URL
    - Development: `http://localhost:3005`
    - Production: `https://your-domain.com`

  version: 1.0.0
  contact:
    name: Infinite Track Backend
    email: support@infinitetrack.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:3005
    description: Development server
  - url: https://your-domain.com
    description: Production server

security:
  - bearerAuth: []
  - cookieAuth: []

paths:
  # Health Check
  /health:
    get:
      tags:
        - System
      summary: Health check endpoint
      description: Check if the API server is running and healthy
      security: []
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: 'OK'
                  timestamp:
                    type: string
                    format: date-time
                    example: '2025-07-05T12:00:00.000Z'

  # Authentication Endpoints
  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: User login
      description: |
        Authenticate user credentials, create a refresh-backed session, and issue an access token.

        Browser clients receive HTTP-only `token` and `refresh_token` cookies, and the response body still includes the access token in `data.token`.
        Non-browser clients receive the access token in `data.token` and the refresh token in `data.refresh_token`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful and session created
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LoginWebResponse'
                  - $ref: '#/components/schemas/LoginNonWebResponse'
        '400':
          $ref: '#/components/responses/AuthLoginError'
        '500':
          $ref: '#/components/responses/AuthLoginServerError'

  /api/auth/register:
    post:
      tags:
        - Authentication
      summary: User registration
      description: Register a new user account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - full_name
                - role_id
                - position_id
                - division_id
              properties:
                email:
                  type: string
                  format: email
                  example: 'newuser@company.com'
                password:
                  type: string
                  format: password
                  minLength: 6
                  example: 'password123'
                full_name:
                  type: string
                  example: 'John Doe'
                role_id:
                  type: integer
                  example: 2
                position_id:
                  type: integer
                  example: 1
                division_id:
                  type: integer
                  example: 1
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'User registered successfully'
                  data:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh access token
      description: |
        Rotate the active refresh session and issue a new access token.

        Browser clients can supply the refresh credential through the HTTP-only `refresh_token` cookie.
        Non-browser clients can supply it in the JSON body as `refresh_token`.
        Refresh succeeds only while the persisted refresh session is still active.
        The refresh session is rejected when the refresh JWT is invalid, when the session was revoked, when the persisted session `expires_at` has passed, or when there has been no successful login/refresh activity for longer than `JWT_REFRESH_INACTIVITY_WINDOW_SECONDS` (48 hours in the current deployment contract).
        Once the refresh session is expired or inactive, clients must perform a full login again.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Refresh successful
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/RefreshWebResponse'
                  - $ref: '#/components/schemas/RefreshNonWebResponse'
        '401':
          description: Refresh rejected because the token or refresh session is invalid
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/RefreshInvalidError'
                  - $ref: '#/components/schemas/RefreshRevokedError'
                  - $ref: '#/components/schemas/RefreshExpiredError'
        '500':
          $ref: '#/components/responses/AuthInternalServerError'

  /api/auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout current session
      description: |
        Clear the `token` and `refresh_token` cookies and revoke the current refresh session when it can be identified.

        Session identification can come from the authenticated access token (`Authorization: Bearer <access_token>` or `token` cookie) or from the refresh token (`refresh_token` cookie or body field for non-browser clients).
        Invalid or expired JWT credentials do not block cookie clearing; this endpoint stays idempotent and only revokes a server-side session when one can still be resolved.
        Revoking the refresh session blocks future refresh attempts, but it does not retroactively invalidate a still-valid access token because protected routes currently verify access JWTs statelessly until their own expiry.
        Session-store failures after a session has been identified return the generic auth 500 response. Unexpected token-verification failures are delegated to the shared error handler.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '500':
          $ref: '#/components/responses/AuthInternalServerError'

  /api/auth/me:
    get:
      tags:
        - Authentication
      summary: Get current user
      description: |
        Get the authenticated user profile resolved from the current access token and database record.

        Protected-route authentication is currently stateless at the access-token layer, so a refresh session that has already been revoked does not block a still-valid access token until that access JWT expires.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: User information retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/AuthenticatedUserNotFound'

  # Attendance Endpoints
  /api/attendance:
    get:
      tags:
        - Attendance
      summary: Get all attendances (Admin/Management only)
      description: Retrieve all attendance records with search and pagination
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number for pagination
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: Number of items per page
        - in: query
          name: search
          schema:
            type: string
          description: Search by user name or email
        - in: query
          name: date
          schema:
            type: string
            format: date
          description: Filter by specific date (YYYY-MM-DD)
        - in: query
          name: user_id
          schema:
            type: integer
          description: Filter by specific user ID
      responses:
        '200':
          description: Attendance records retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      attendances:
                        type: array
                        items:
                          $ref: '#/components/schemas/Attendance'
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/attendance/check-in:
    post:
      tags:
        - Attendance
      summary: Check in attendance
      description: Record employee check-in with location verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - latitude
                - longitude
              properties:
                latitude:
                  type: number
                  format: float
                  example: -6.200000
                  description: Latitude coordinate
                longitude:
                  type: number
                  format: float
                  example: 106.816666
                  description: Longitude coordinate
                face_photo:
                  type: string
                  format: binary
                  description: Base64 encoded face photo for verification
      responses:
        '200':
          description: Check-in successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Check-in successful'
                  data:
                    $ref: '#/components/schemas/Attendance'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/attendance/checkout/{id}:
    post:
      tags:
        - Attendance
      summary: Check out attendance
      description: Record employee check-out and calculate work hours
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Attendance record ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - latitude
                - longitude
              properties:
                latitude:
                  type: number
                  format: float
                  example: -6.200000
                longitude:
                  type: number
                  format: float
                  example: 106.816666
                face_photo:
                  type: string
                  format: binary
                  description: Base64 encoded face photo for verification
      responses:
        '200':
          description: Check-out successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Check-out successful'
                  data:
                    $ref: '#/components/schemas/Attendance'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/attendance/history:
    get:
      tags:
        - Attendance
      summary: Get user attendance history
      description: Retrieve attendance history for the current user
      parameters:
        - in: query
          name: month
          schema:
            type: integer
            minimum: 1
            maximum: 12
          description: Filter by month (1-12)
        - in: query
          name: year
          schema:
            type: integer
          description: Filter by year
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
          description: Number of records to return
      responses:
        '200':
          description: Attendance history retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Attendance'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/attendance/status-today:
    get:
      tags:
        - Attendance
      summary: Get today's attendance status
      description: Get current user's attendance status for today
      responses:
        '200':
          description: Today's attendance status
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      has_checked_in:
                        type: boolean
                        example: true
                      has_checked_out:
                        type: boolean
                        example: false
                      attendance:
                        $ref: '#/components/schemas/Attendance'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/attendance/location-event:
    post:
      tags:
        - Attendance
      summary: Log location event
      description: Log geofence enter/exit events for smart attendance tracking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - event_type
                - latitude
                - longitude
              properties:
                event_type:
                  type: string
                  enum: [enter, exit]
                  example: 'enter'
                latitude:
                  type: number
                  format: float
                  example: -6.200000
                longitude:
                  type: number
                  format: float
                  example: 106.816666
                location_name:
                  type: string
                  example: 'Office Building'
      responses:
        '200':
          description: Location event logged successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Location event logged successfully'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/attendance/{id}:
    delete:
      tags:
        - Attendance
      summary: Delete attendance record (Admin/Management only)
      description: Delete a specific attendance record
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Attendance record ID
      responses:
        '200':
          description: Attendance record deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Attendance record deleted successfully'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # User Management Endpoints
  /api/users:
    get:
      tags:
        - User Management
      summary: Get all users (Admin/Management only)
      description: Retrieve all users with full profile details
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number for pagination
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: Number of items per page
        - in: query
          name: search
          schema:
            type: string
          description: Search by name or email
        - in: query
          name: role_id
          schema:
            type: integer
          description: Filter by role ID
        - in: query
          name: division_id
          schema:
            type: integer
          description: Filter by division ID
      responses:
        '200':
          description: Users retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      users:
                        type: array
                        items:
                          $ref: '#/components/schemas/User'
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags:
        - User Management
      summary: Create new user (Admin/Management only)
      description: Create a new user account with profile details
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - email
                - password
                - full_name
                - role_id
                - position_id
                - division_id
              properties:
                email:
                  type: string
                  format: email
                  example: 'newuser@company.com'
                password:
                  type: string
                  format: password
                  minLength: 6
                  example: 'password123'
                full_name:
                  type: string
                  example: 'John Doe'
                role_id:
                  type: integer
                  example: 2
                position_id:
                  type: integer
                  example: 1
                division_id:
                  type: integer
                  example: 1
                face_photo:
                  type: string
                  format: binary
                  description: Face photo file upload
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'User created successfully'
                  data:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/users/{id}:
    get:
      tags:
        - User Management
      summary: Get user by ID (Admin/Management only)
      description: Retrieve detailed information about a specific user
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: User ID
      responses:
        '200':
          description: User information retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags:
        - User Management
      summary: Update user (Admin/Management only)
      description: Update user information
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: User ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name:
                  type: string
                  example: 'John Doe Updated'
                email:
                  type: string
                  format: email
                  example: 'updated@company.com'
                role_id:
                  type: integer
                  example: 3
                position_id:
                  type: integer
                  example: 2
                division_id:
                  type: integer
                  example: 1
                is_active:
                  type: boolean
                  example: true
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'User updated successfully'
                  data:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - User Management
      summary: Delete user (Admin/Management only)
      description: Delete a user account
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: User ID
      responses:
        '200':
          description: User deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'User deleted successfully'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/users/{id}/photo:
    post:
      tags:
        - User Management
      summary: Upload user face photo (Admin/Management only)
      description: Upload or update user's face photo for facial recognition
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: User ID
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - face_photo
              properties:
                face_photo:
                  type: string
                  format: binary
                  description: Face photo file upload
      responses:
        '200':
          description: Photo uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Photo uploaded successfully'
                  data:
                    type: object
                    properties:
                      photo_url:
                        type: string
                        example: 'https://cloudinary.com/photo.jpg'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # WFA Booking Endpoints
  /api/bookings:
    get:
      tags:
        - WFA Bookings
      summary: Get all bookings (Admin/Management only)
      description: Retrieve all WFA booking requests with filtering options
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number for pagination
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: Number of items per page
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, approved, rejected]
          description: Filter by booking status
        - in: query
          name: date_from
          schema:
            type: string
            format: date
          description: Filter bookings from this date
        - in: query
          name: date_to
          schema:
            type: string
            format: date
          description: Filter bookings until this date
        - in: query
          name: user_id
          schema:
            type: integer
          description: Filter by specific user ID
      responses:
        '200':
          description: Bookings retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      bookings:
                        type: array
                        items:
                          $ref: '#/components/schemas/Booking'
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags:
        - WFA Bookings
      summary: Create WFA booking
      description: Create a new Work From Anywhere booking request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - date
                - location_name
                - latitude
                - longitude
                - reason
              properties:
                date:
                  type: string
                  format: date
                  example: '2025-07-10'
                location_name:
                  type: string
                  example: 'Coffee Shop Downtown'
                latitude:
                  type: number
                  format: float
                  example: -6.200000
                longitude:
                  type: number
                  format: float
                  example: 106.816666
                reason:
                  type: string
                  example: 'Working on client presentation'
                notes:
                  type: string
                  example: 'Will be available 9 AM - 5 PM'
      responses:
        '201':
          description: Booking created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'WFA booking created successfully'
                  data:
                    $ref: '#/components/schemas/Booking'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/bookings/history:
    get:
      tags:
        - WFA Bookings
      summary: Get booking history with advanced filtering
      description: |
        Retrieve authenticated user's WFA booking history with comprehensive filtering, pagination, and sorting options.
        This endpoint provides rich metadata and flexible querying capabilities for user booking management.
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, approved, rejected]
          description: Filter bookings by status
          example: 'approved'
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number for pagination
          example: 1
        - in: query
          name: limit
