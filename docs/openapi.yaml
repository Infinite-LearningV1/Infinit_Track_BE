                  type: object
                  description: Optional deterministic discipline distribution for generated rows.
                  properties:
                    ontime:
                      type: number
                      example: 75
                    late:
                      type: number
                      example: 12
                    early:
                      type: number
                      example: 8
                    alpha:
                      type: number
                      example: 5
      responses:
        '200':
