        - in: query
          name: q
          deprecated: false
          schema:
            type: string
            example: nico
          description: Canonical free-text search for report/export scope rows. Applies before building the workbook export payload.
        - in: query
          name: search
          deprecated: true
          schema:
            type: string
            example: nico
          description: Deprecated alias for `q`. If multiple aliases are provided, precedence is `q`, then `search`, then `query`, then `keyword`.
        - in: query
          name: query
          deprecated: true
          schema:
            type: string
            example: nico
          description: Deprecated alias for `q`. Prefer `q` for new clients.
        - in: query
          name: keyword
          deprecated: true
          schema:
            type: string
            example: nico
          description: Deprecated alias for `q`. Prefer `q` for new clients.
      responses:
        '200':
          description: Excel workbook payload generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SummaryReportExcelResponse'
        '400':
          description: Invalid summary period value
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  code:
                    type: string
                    example: E_VALIDATION
                  message:
                    type: string
                    example: Parameter period harus berupa: daily, weekly, monthly, range, 30d, current_month, atau custom
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

