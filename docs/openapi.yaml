  /api/summary/reports:
    get:
      tags:
        - Reports & Analytics
      summary: Get summary report (Admin/Management only)
      description: Retrieve the canonical reporting and export contract for summary aggregates, attendance report rows, and discipline-analysis overview for Admin or Management users.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: period
          schema:
            type: string
            enum: [daily, weekly, monthly, range, 30d, current_month, custom]
            default: monthly
          description: Dashboard/report window. Canonical values are `daily` (today), `weekly` (rolling 7 days), `monthly` (rolling 30 days), and `range` with `from`/`to`. Legacy values `30d`, `current_month`, and `custom` remain temporarily supported. `all` is not supported.
        - in: query
          name: from
          schema:
            type: string
            format: date
            example: '2026-04-01'
          description: Custom range start date in YYYY-MM-DD format. Required when period=range or deprecated period=custom.
        - in: query
          name: to
          schema:
            type: string
            format: date
            example: '2026-04-30'
          description: Custom range end date in YYYY-MM-DD format. Required when period=range or deprecated period=custom.
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Report pagination page number.
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            default: 10
          description: Number of attendance rows returned in the report section.
        - in: query
          name: q
          deprecated: false
          schema:
            type: string
            example: nico
          description: Canonical free-text search for report rows. Applies before pagination to `report.data`, `report.pagination`, and `report.user_attendance_summary`; top-level `summary` remains period-wide, while `analytics.discipline_analysis` reflects the visible report users for the current page.
        - in: query
          name: search
          deprecated: true
          schema:
            type: string
            example: nico
          description: Deprecated alias for `q`. If multiple aliases are provided, precedence is `q`, then `search`, then `query`, then `keyword`.
        - in: query
          name: query
          deprecated: true
          schema:
            type: string
            example: nico
          description: Deprecated alias for `q`. Prefer `q` for new clients.
        - in: query
          name: keyword
          deprecated: true
          schema:
            type: string
            example: nico
          description: Deprecated alias for `q`. Prefer `q` for new clients.
      responses:
        '200':
          description: Summary report with discipline analysis generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SummaryReportResponse'
        '400':
          description: Invalid summary period value
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  code:
                    type: string
                    example: E_VALIDATION
                  message:
                    type: string
                    example: Parameter period harus berupa: daily, weekly, monthly, range, 30d, current_month, atau custom
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

