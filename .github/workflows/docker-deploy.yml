name: Publish Backend Image

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '18'
  DOCKER_IMAGE: registry.digitalocean.com/infinit-track/infinit-track-backend

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: test_secret_ci
          DB_HOST: localhost
          DB_NAME: test_db
          DB_USER: test_user
          DB_PASS: test_pass
          CLOUDINARY_CLOUD_NAME: test_cloud
          CLOUDINARY_API_KEY: test_key
          CLOUDINARY_API_SECRET: test_secret

  build-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Login to DOCR
        run: doctl registry login --expiry-seconds 1200
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish summary
        run: |
          echo "## Backend Image Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Published immutable image: \`${DOCKER_IMAGE}:${GITHUB_SHA}\`" >> $GITHUB_STEP_SUMMARY
          echo "Published rolling tag: \`${DOCKER_IMAGE}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "Use the immutable SHA tag for droplet rollout." >> $GITHUB_STEP_SUMMARY
