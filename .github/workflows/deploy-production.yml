name: Deploy to Production

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

env:
  NODE_VERSION: '18'
  DOCKER_IMAGE: registry.digitalocean.com/infinit-track/infinit-track-backend
  PRODUCTION_SSH_HOST: ${{ vars.PRODUCTION_SSH_HOST }}
  PRODUCTION_SSH_USER: ${{ vars.PRODUCTION_SSH_USER }}
  PRODUCTION_DEPLOY_PATH: ${{ vars.PRODUCTION_DEPLOY_PATH }}
  PRODUCTION_PUBLIC_DOMAIN: ${{ vars.PRODUCTION_PUBLIC_DOMAIN }}
  PRODUCTION_PUBLIC_BASE_URL: ${{ vars.PRODUCTION_PUBLIC_BASE_URL }}
  PRODUCTION_EXPECTED_IP: ${{ vars.PRODUCTION_EXPECTED_IP }}
  PRODUCTION_WEB_ORIGIN: ${{ vars.PRODUCTION_WEB_ORIGIN }}

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_NAME: test_db
          DB_USER: test_user
          DB_PASS: test_pass
          JWT_SECRET: test_secret_for_ci_only
          CLOUDINARY_CLOUD_NAME: test_cloud
          CLOUDINARY_API_KEY: test_key
          CLOUDINARY_API_SECRET: test_secret

  build-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Login to DOCR
        run: doctl registry login --expiry-seconds 1200

      - name: Build and push immutable image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-production:
    name: Deploy to Production Droplet
    runs-on: ubuntu-latest
    needs: build-push
    if: github.event_name != 'pull_request'

    environment:
      name: production
      url: ${{ vars.PRODUCTION_PUBLIC_BASE_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate production runtime contract
        run: |
          for value in \
            "$PRODUCTION_SSH_HOST" \
            "$PRODUCTION_SSH_USER" \
            "$PRODUCTION_DEPLOY_PATH" \
            "$PRODUCTION_PUBLIC_DOMAIN" \
            "$PRODUCTION_PUBLIC_BASE_URL" \
            "$PRODUCTION_EXPECTED_IP" \
            "$PRODUCTION_WEB_ORIGIN"
          do
            if [ -z "$value" ]; then
              echo "Missing required production runtime variable. Check GitHub environment vars."
              exit 1
            fi
          done

          if [ "$PRODUCTION_WEB_ORIGIN" != "https://infinite-track.tech" ]; then
            echo "PRODUCTION_WEB_ORIGIN must equal the canonical Web FE origin https://infinite-track.tech."
            exit 1
          fi

      - name: Configure SSH key
        run: |
          mkdir -p "$HOME/.ssh"
          printf '%s\n' '${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}' > "$HOME/.ssh/production.key"
          chmod 600 "$HOME/.ssh/production.key"
          ssh-keyscan -H "$PRODUCTION_SSH_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Sync tracked runtime artifacts
        run: |
          set -euo pipefail
          tar -czf - docker-compose.yml deploy/scripts/verify-droplet-api.sh \
            deploy/scripts/persist-backend-image-tag.sh \
            | ssh -i "$HOME/.ssh/production.key" -o IdentitiesOnly=yes "$PRODUCTION_SSH_USER@$PRODUCTION_SSH_HOST" "
                set -euo pipefail
                mkdir -p '$PRODUCTION_DEPLOY_PATH/deploy/scripts'
                tar -xzf - -C '$PRODUCTION_DEPLOY_PATH'
              "

      - name: Deploy selected image on production droplet
        run: |
          ssh -i "$HOME/.ssh/production.key" -o IdentitiesOnly=yes "$PRODUCTION_SSH_USER@$PRODUCTION_SSH_HOST" "
            set -euo pipefail
            cd '$PRODUCTION_DEPLOY_PATH'
            echo '${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}' | docker login registry.digitalocean.com -u doctl --password-stdin
            chmod +x ./deploy/scripts/persist-backend-image-tag.sh
            ./deploy/scripts/persist-backend-image-tag.sh .env "${GITHUB_SHA}"
            grep -qx "BACKEND_IMAGE_TAG=${GITHUB_SHA}" .env
            export BACKEND_IMAGE="${DOCKER_IMAGE}"
            docker compose pull app
            docker compose up -d --force-recreate app
            docker compose exec -T app npm run migrate
            chmod +x ./deploy/scripts/verify-droplet-api.sh
            DOMAIN="${PRODUCTION_PUBLIC_DOMAIN}" EXPECTED_IP="${PRODUCTION_EXPECTED_IP}" ./deploy/scripts/verify-droplet-api.sh
            docker compose exec -T app npm run migrate:status
          "

      - name: Run external ingress and direct-port negative gate
        run: |
          chmod +x ./deploy/scripts/verify-public-ingress.sh
          DOMAIN="$PRODUCTION_PUBLIC_DOMAIN" PUBLIC_IP="$PRODUCTION_EXPECTED_IP" ./deploy/scripts/verify-public-ingress.sh

      - name: Verify production Web-origin contract and run blocking smoke
        run: |
          set -euo pipefail
          DEPLOYED_CORS_ORIGIN="$(ssh -i "$HOME/.ssh/production.key" -o IdentitiesOnly=yes "$PRODUCTION_SSH_USER@$PRODUCTION_SSH_HOST" "
            cd '$PRODUCTION_DEPLOY_PATH'
            docker compose exec -T app printenv CORS_ORIGIN
          " | tr -d '\r\n')"

          if [ -z "$DEPLOYED_CORS_ORIGIN" ]; then
            echo "Production deployed CORS_ORIGIN is empty."
            exit 1
          fi

          if [ "$DEPLOYED_CORS_ORIGIN" != "$PRODUCTION_WEB_ORIGIN" ]; then
            echo "Production CORS mismatch: deployed backend origin does not match PRODUCTION_WEB_ORIGIN."
            exit 1
          fi

          WEB_ORIGIN="$PRODUCTION_WEB_ORIGIN" npm run smoke-test "$PRODUCTION_PUBLIC_BASE_URL"

      - name: Deployment summary
        run: |
          echo "## Production Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Immutable image published: \`${DOCKER_IMAGE}:${GITHUB_SHA}\`" >> $GITHUB_STEP_SUMMARY
          echo "Droplet runtime updated via Docker Compose" >> $GITHUB_STEP_SUMMARY
          echo "Migrations executed on production runtime" >> $GITHUB_STEP_SUMMARY
          echo "Remote readiness verification passed" >> $GITHUB_STEP_SUMMARY
          echo "Smoke gate passed against ${PRODUCTION_PUBLIC_BASE_URL}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Canonical host: ${PRODUCTION_PUBLIC_BASE_URL}" >> $GITHUB_STEP_SUMMARY
          echo "Health endpoint: ${PRODUCTION_PUBLIC_BASE_URL}/health" >> $GITHUB_STEP_SUMMARY
          echo "Liveness endpoint: ${PRODUCTION_PUBLIC_BASE_URL}/livez" >> $GITHUB_STEP_SUMMARY
          echo "API docs: ${PRODUCTION_PUBLIC_BASE_URL}/docs (authenticated Admin/Management only)" >> $GITHUB_STEP_SUMMARY

  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [test, build-push, deploy-production]
    if: failure()

    steps:
      - name: Deployment failed
        run: |
          echo "## Production Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The production release path is blocked until lint, test, image publication, droplet rollout, migrations, and smoke verification all pass." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Investigate:" >> $GITHUB_STEP_SUMMARY
          echo "- DOCR image publication logs" >> $GITHUB_STEP_SUMMARY
          echo "- Production droplet rollout command output" >> $GITHUB_STEP_SUMMARY
          echo "- ./deploy/scripts/verify-droplet-api.sh result" >> $GITHUB_STEP_SUMMARY
          echo "- npm run smoke-test ${PRODUCTION_PUBLIC_BASE_URL}" >> $GITHUB_STEP_SUMMARY
